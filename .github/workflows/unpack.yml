name: Unpack USJ Lens

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/unpack.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack PWA
        run: |
          unzip -o usj-lens-pwa-final.zip
          rm usj-lens-pwa-final.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack USJ Lens PWA" || exit 0
          git push
